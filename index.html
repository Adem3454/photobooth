<!DOCTYPE html>
<html lang="tr" data-skin="retro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photobooth</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photobooth">
<meta name="theme-color" content="#111111">
<script async src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root,[data-skin=ios]{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--acc:#0a84ff;--onacc:#fff;--ico:#0a84ff;--tx:#fff;--ctx:#fff;--tx2:#8e8e93;--ring:#fff;--r:24px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--glow:0 12px 40px #000a;--sheet:#1c1c1ee8;--grab:#5a5a5e}
[data-skin=retro]{--bg:repeating-linear-gradient(90deg,#6e1423 0 28px,#5a0f1c 28px 56px);--card:#f3e5c3;--card2:#e8d4a2;--acc:#f2c14e;--onacc:#3b1c12;--ico:#6e1423;--tx:#f7ebd0;--ctx:#3b1c12;--tx2:#d9b99b;--ring:#f7ebd0;--r:14px;--font:Georgia,"Times New Roman",serif;--glow:0 0 0 6px #f3e5c3,0 0 0 9px #2a0a10,0 16px 34px #000b;--sheet:#f3e5c3f2;--grab:#b89c6a}
[data-skin=pastel]{--bg:linear-gradient(160deg,#ffd6e8,#d6e4ff 55%,#d9ffe8);--card:#ffffffb3;--card2:#fff;--acc:#ff6ea8;--onacc:#fff;--ico:#ff6ea8;--tx:#3a2a4a;--ctx:#3a2a4a;--tx2:#7d6b92;--ring:#ff6ea8;--r:30px;--font:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;--glow:0 14px 34px #ff6ea855;--sheet:#fffffff0;--grab:#cdbfe0}
[data-skin=neon]{--bg:radial-gradient(circle at 15% 0,#3d0a63,transparent 55%),radial-gradient(circle at 95% 100%,#00375a,transparent 55%),#05010f;--card:#150a2a;--card2:#22123f;--acc:#ff2bd6;--onacc:#fff;--ico:#00f0ff;--tx:#fff;--ctx:#fff;--tx2:#a58bd0;--ring:#00f0ff;--r:22px;--font:-apple-system,"SF Pro Display",system-ui,sans-serif;--glow:0 0 0 2px #ff2bd6aa,0 0 34px #ff2bd666,0 12px 40px #000a;--sheet:#0f0620ee;--grab:#5a3a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);background-color:#000;min-height:100%}
html[data-skin=pastel],html[data-skin=retro]{background-color:#fff}
html[data-skin=pastel]{background-size:200% 200%;animation:bgshift 14s ease infinite}
@keyframes bgshift{50%{background-position:100% 100%}}
body{margin:0;height:100%;color:var(--tx);font:17px/1.3 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
[hidden]{display:none!important}
main{height:100dvh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 14px);overflow:auto;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{width:100%;max-width:480px;height:48px;flex:none;display:flex;align-items:center;justify-content:space-between}
.bar h1{margin:0;font-size:19px;font-weight:700;flex:1;text-align:center}
[data-skin=retro] .bar h1{text-transform:uppercase;letter-spacing:.22em;font-size:16px}
[data-skin=neon] .bar h1{text-shadow:0 0 14px var(--acc),0 0 2px #fff}
[data-skin=pastel] .bar h1{font-weight:800}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ico);display:grid;place-items:center;transition:transform .15s}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stage{position:relative;display:flex;width:100%;max-width:480px;aspect-ratio:4/3;background:#111;border-radius:var(--r);overflow:hidden;box-shadow:var(--glow);flex:none}
video{flex:1;min-width:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.glass{position:absolute;top:10px;right:10px;z-index:2;width:42px;height:42px;border-radius:50%;border:0;color:#fff;background:#0007;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;place-items:center;transition:transform .15s}
#count{position:absolute;inset:0;display:grid;place-items:center;font-size:130px;font-weight:700;color:#fff;text-shadow:0 4px 24px #0009;pointer-events:none}
#count.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(1.9);opacity:0}to{transform:scale(1);opacity:1}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
#flash.on{opacity:1;transition:none}
#dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px}
#dots i{width:9px;height:9px;border-radius:50%;background:#fff5;transition:.25s}
#dots i.on{background:#fff;transform:scale(1.3)}
#stk{position:absolute;inset:0;pointer-events:none;overflow:hidden}#stk span{position:absolute;line-height:1}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.strip{display:flex;gap:8px;overflow-x:auto;width:100%;max-width:480px;flex:none;scrollbar-width:none;padding:2px}
.strip::-webkit-scrollbar{display:none}.strip .chip{flex:none}
.chip{border:0;background:var(--card2);color:var(--ctx);border-radius:99px;padding:11px 18px;font:600 16px var(--font);transition:transform .15s,background .2s}
.chip.sel{background:var(--acc);color:var(--onacc)}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid #8884;transition:transform .15s}
.sw.sel{box-shadow:0 0 0 2px var(--card2),0 0 0 4px var(--acc)}
.seg{display:flex;width:100%;max-width:480px;flex:none;background:var(--card);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--ctx);padding:11px 4px;border-radius:11px;font:600 15px var(--font);transition:background .2s}
.seg .sel,.seg .on{background:var(--acc);color:var(--onacc);box-shadow:0 2px 8px #0004}
.ib:active,.glass:active,.chip:active,.sw:active,.btn:active,.dk:active .ico,.skin:active{transform:scale(.93)}
.dock{margin-top:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;max-width:480px;padding-top:6px}
.dk{justify-self:center;border:0;background:none;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:7px;font:600 13px var(--font)}
.ico{width:58px;height:58px;border-radius:50%;background:var(--card);color:var(--ico);display:grid;place-items:center;transition:transform .15s}
.shutter{flex:none;width:92px;height:92px;border-radius:50%;border:5px solid var(--ring);background:transparent;padding:0;display:grid;place-items:center;transition:transform .12s,border-color .2s}
[data-skin=neon] .shutter{box-shadow:0 0 24px var(--ring),inset 0 0 14px #00f0ff55}
.shutter span{width:70px;height:70px;border-radius:50%;background:var(--ring);transition:transform .2s,background .2s,border-radius .2s}
.shutter:active span{transform:scale(.88)}
.shutter:disabled{border-color:var(--red);animation:pulse 1s infinite}
.shutter:disabled span{background:var(--red);transform:scale(.55);border-radius:16px}
@keyframes pulse{50%{transform:scale(1.07)}}
.btn{width:100%;max-width:480px;border:0;border-radius:16px;padding:17px;font:700 17px var(--font);transition:transform .15s}
.primary{background:var(--acc);color:var(--onacc)}.tint{background:var(--card2);color:var(--ico)}
[data-skin=neon] .primary{box-shadow:0 0 22px #ff2bd688}
.two{display:flex;gap:10px;width:100%;max-width:480px}.two .btn{flex:1}
input{background:var(--card2);border:0;border-radius:14px;color:var(--ctx);padding:14px 16px;font:17px var(--font);width:100%;outline:none}
input::placeholder{color:var(--tx2)}
#code{width:110px;text-align:center;letter-spacing:4px;text-transform:uppercase;font-weight:700}
#msg{min-height:20px;margin:0;font-size:14px;color:var(--red);text-align:center}
#rem{justify-content:flex-start}#rmsg{text-align:center;color:var(--green,#30d158);margin:0;min-height:22px}
.hint,.or{color:var(--tx2);font-size:15px;text-align:center;margin:0;max-width:340px}
.imgwrap{flex:1;display:grid;place-items:center;width:100%;min-height:0}
#out,#gifout{max-width:100%;max-height:calc(100dvh - 250px);border-radius:8px;box-shadow:0 14px 40px #000c;animation:rise .6s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{transform:translateY(50px) scale(.9);opacity:0}}
#scrim{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;z-index:21;background:var(--sheet);color:var(--tx);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-radius:28px 28px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(105%);visibility:hidden;transition:transform .45s cubic-bezier(.32,1.2,.4,1),visibility 0s .45s}
#sheet.open{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.32,1.2,.4,1)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--grab);margin:0 auto 12px}
.panel{display:flex;flex-direction:column;gap:14px;padding:16px 0;min-height:130px}
.skin{flex:1 1 44%;display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:16px;border:2px solid transparent;background:var(--card2);color:var(--ctx);font:600 15px var(--font);transition:transform .15s}
.skin.sel{border-color:var(--acc)}.skin i{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #8883}
.cf{position:fixed;top:-14px;width:8px;height:12px;border-radius:2px;z-index:50;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),108vh) rotate(540deg)}}

:root,[data-skin=ios]{--mb:#2a2a2d;--mb2:#161618;--mc1:#0a84ff;--mc2:#0764c2;--mt:#d1d1d6}
[data-skin=retro]{--mb:#9b1b2c;--mb2:#6e1423;--mc1:#c1272d;--mc2:#8f1d2c;--mt:#f2c14e}
[data-skin=pastel]{--mb:#ff9ec7;--mb2:#f27eb1;--mc1:#ffd1e4;--mc2:#ffb6d3;--mt:#fff}
[data-skin=neon]{--mb:#1a0b33;--mb2:#0d0420;--mc1:#ff2bd6;--mc2:#9b0d86;--mt:#00f0ff}
#cam{position:relative;gap:10px;padding-top:calc(env(safe-area-inset-top) + 8px)}
.corner{position:absolute;top:calc(env(safe-area-inset-top) + 6px);right:12px;z-index:6;font-size:18px}
.machine{position:relative;flex:1;min-height:0;width:100%;max-width:420px;display:flex;gap:6px}
.cab{flex:1;min-width:0;display:flex;flex-direction:column}
.sign{flex:none;align-self:center;width:84%;text-align:center;padding:7px 0;background:var(--mt);color:var(--mb);font:900 18px Georgia,serif;letter-spacing:.2em;border-radius:12px 12px 4px 4px;position:relative;box-shadow:0 0 22px #ffd86b66;z-index:4}
@keyframes blink{50%{border-color:#ffffff66;box-shadow:0 0 8px #ffd86b55}}
.body{position:relative;flex:1;min-height:0;margin-top:-4px;padding-top:34px;display:flex;flex-direction:column;align-items:center;gap:10px;background:linear-gradient(90deg,var(--mb2),var(--mb) 16%,var(--mb) 84%,var(--mb2));border-radius:16px 16px 6px 6px;box-shadow:inset 0 0 0 3px var(--mt),0 18px 40px #000a}
.bulb{position:absolute;top:9px;width:13px;height:13px;border-radius:50%;background:#ffe3a0;box-shadow:0 0 8px #ffd27a;transition:.1s}
.bulb.l{left:16px}.bulb.r{right:16px}.bulb.pop{background:#fff;box-shadow:0 0 34px 16px #fff6c8}
.window{position:relative;width:94%;flex:none;transform-origin:50% 40%;transition:transform 1s cubic-bezier(.3,1.35,.5,1)}
.machine.shooting .window{transform:scale(1.07)}
.monitor{position:relative;padding:6px;background:linear-gradient(135deg,#8a8a90,#2b2b2e 45%,#6d6d72);border-radius:14px;box-shadow:0 0 0 3px var(--mt),0 10px 24px #000a}
.monitor::after{content:"";position:absolute;inset:6px;border-radius:9px;background:linear-gradient(115deg,#0000 30%,#fff3 44%,#0000 58%) 100% 0/260% 100%;animation:sweep 8s ease-in-out infinite;pointer-events:none;z-index:3}
.monitor .stage{border-radius:9px;box-shadow:none}
.rod{position:absolute;left:-10px;right:-10px;top:-13px;height:7px;border-radius:4px;z-index:9;background:linear-gradient(#f6e08a,var(--mt) 40%,#7a5c14);box-shadow:0 3px 5px #0009}
.rod::before,.rod::after{content:"";position:absolute;top:-3px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b8,var(--mt) 55%,#7a5c14)}
.rod::before{left:-6px}.rod::after{right:-6px}
.curtain{position:absolute;top:-8px;bottom:-10px;width:38%;z-index:7;transform:scaleX(.62);transition:transform 1.3s cubic-bezier(.55,0,.2,1)}
.curtain.l{left:-2px;transform-origin:left}.curtain.r{right:-2px;transform-origin:right}
.curtain svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(5px 0 7px #0008);animation:drift 7s ease-in-out infinite alternate;transform-origin:50% 0}
.curtain.r svg{filter:drop-shadow(-5px 0 7px #0008)}
@keyframes drift{from{transform:skewX(-.7deg)}to{transform:skewX(.7deg)}}
.machine.open .curtain{transform:scaleX(.3)}
.plaque{flex:none;padding:4px 12px;font:700 11px Georgia,serif;letter-spacing:.16em;background:linear-gradient(#e9e2c8,#bfb28a);color:#3b2a14;border-radius:3px;box-shadow:0 1px 0 #fff8 inset,0 2px 4px #0006}
.lower{flex:1;min-height:18px;width:86%;border-radius:6px 6px 0 0;background:repeating-linear-gradient(0deg,#0006 0 3px,#0000 3px 9px),linear-gradient(var(--mb2),var(--mb));box-shadow:inset 0 0 0 2px var(--mt)}
.plinth{flex:none;height:12px;background:var(--mb2);border-radius:0 0 8px 8px;box-shadow:inset 0 0 0 3px var(--mt)}
.machine.motor{animation:shake .09s linear infinite}
@keyframes shake{25%{transform:translateX(-.6px)}75%{transform:translateX(.6px)}}
.side{position:relative;width:76px;flex:none;display:flex;flex-direction:column;align-items:center;padding-top:44px}
.leds{display:flex;gap:5px;margin-bottom:8px}
.leds i{width:9px;height:9px;border-radius:50%;background:#3a1a1a;box-shadow:inset 0 0 0 1px #0006;transition:.2s}
.leds i.on{background:#ff5a4d;box-shadow:0 0 8px #ff5a4d}
.slit{position:relative;z-index:7;flex:none;width:70px;height:12px;background:#050203;border-radius:3px;box-shadow:0 0 0 3px var(--mt),inset 0 2px 4px #000}
.chute{position:relative;flex:1;width:76px}
.chute::before{content:"";position:absolute;inset:0 6px;border-left:3px solid var(--mt);border-right:3px solid var(--mt);background:linear-gradient(90deg,#0006,#0001 30%,#0001 70%,#0006);opacity:.45}
.paper{position:absolute;left:50%;top:0;bottom:0;width:64px;transform:translateX(-50%);overflow:hidden;z-index:4}
.pi{transform-origin:50% 0}
.pi.hang{animation:sway 1.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
.pi.land{animation:land .55s ease-out}
@keyframes land{0%{transform:translateY(-12px) rotate(-2deg)}35%{transform:translateY(4px) rotate(1.2deg)}65%{transform:translateY(-3px)}100%{transform:none}}
#pimg{width:56px;display:block;margin:0 auto;box-shadow:0 6px 14px #0009}
#pimg:not([src]){display:none}
.pw.ready{cursor:pointer;animation:glowp 1.3s ease-in-out infinite}
@keyframes glowp{50%{filter:drop-shadow(0 0 7px var(--mt))}}
.tray{position:absolute;z-index:6;bottom:8px;left:50%;transform:translateX(-50%);width:76px;height:50px;background:linear-gradient(var(--mb),var(--mb2));border:3px solid var(--mt);border-radius:6px 6px 14px 14px;display:grid;place-items:end center;padding-bottom:5px;font:700 11px -apple-system,system-ui,sans-serif;color:var(--mt);box-shadow:0 6px 14px #0008}
canvas.drop{position:absolute;z-index:10;border:6px solid #fff;border-radius:6px;box-shadow:0 12px 28px #000b;transition:transform .6s cubic-bezier(.45,0,.25,1),opacity .2s .45s}

.sb{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#8a6d2c;animation:sbc 2.5s linear infinite}
@keyframes sbc{0%,28%{background:#fff3a8;box-shadow:0 0 8px 2px #ffd86b}40%,100%{background:#8a6d2c;box-shadow:none}}
@keyframes sweep{from{background-position:100% 0}to{background-position:0 0}}
.lamps{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:9px}
.lamps i{width:15px;height:15px;border-radius:50%;background:#2a1a1a;box-shadow:inset 0 0 0 2px #0008;transition:.12s}
.lamps .lr.on{background:#ff3b30;box-shadow:0 0 12px 3px #ff3b30}.lamps .ly.on{background:#ffcc00;box-shadow:0 0 12px 3px #ffcc00}.lamps .lg.on{background:#30d158;box-shadow:0 0 12px 3px #30d158}
.rec{position:absolute;left:50%;bottom:-1px;margin-left:-4px;width:8px;height:8px;border-radius:50%;background:#ff3b30;box-shadow:0 0 8px #ff3b30;animation:recb 1.6s steps(2) infinite;z-index:4}
@keyframes recb{50%{opacity:.15}}
#af{position:absolute;left:32%;right:32%;top:26%;bottom:30%;border:2px solid #ffd60a;border-radius:6px;opacity:0;pointer-events:none;z-index:2}
#af.on{animation:af .7s ease-out forwards}
@keyframes af{0%{transform:scale(1.6);opacity:0}35%{opacity:1}100%{transform:scale(1);opacity:1}}
video{transition:filter .5s}.burn{filter:brightness(3) contrast(.7)!important;transition:none}
.window{transition:transform 1s cubic-bezier(.3,1.35,.5,1),box-shadow .45s}.window.glow{box-shadow:0 0 60px 22px #fff9}
.gap{position:relative;flex:none;width:94%;height:22px;margin-top:-4px;overflow:hidden;border-radius:0 0 6px 6px;background:linear-gradient(#000,#1a0d0b);box-shadow:inset 0 6px 8px #000}
.feet{position:absolute;left:50%;bottom:0;display:flex;gap:10px;transform:translateX(-50%) translateY(16px);opacity:0;transition:transform .5s .5s,opacity .4s .5s}
.machine.shooting .feet{opacity:1;transform:translateX(-50%)}
.feet i{display:block;width:22px;height:15px;background:#2a1a12;border-radius:10px 12px 3px 3px;border-top:7px solid #4a5d7a;box-shadow:inset 0 -3px 0 #0006;box-sizing:content-box}
.feet i:last-child{transform:rotate(4deg);animation:tap 1.1s ease-in-out infinite}
@keyframes tap{50%{transform:rotate(-7deg) translateY(-2px)}}
.curtain.rustle svg{animation:rustle 1.2s ease-in-out}
@keyframes rustle{0%{transform:none}20%{transform:skewX(3deg) translateX(-2px)}45%{transform:skewX(-2deg)}70%{transform:skewX(1deg)}100%{transform:none}}
#stk span{animation:bob 1.5s ease-in-out infinite alternate}
@keyframes bob{from{translate:0 -3px;scale:1}to{translate:0 4px;scale:1.12}}
.corner2{position:absolute;top:calc(env(safe-area-inset-top) + 6px);left:12px;z-index:6;font-size:18px}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translate(-50%,-90px);padding:10px 18px;border-radius:99px;background:var(--acc);color:var(--onacc);font:700 15px var(--font);z-index:40;transition:transform .45s cubic-bezier(.3,1.4,.5,1);box-shadow:0 8px 24px #0008;white-space:nowrap}
#toast.show{transform:translate(-50%,0)}
.imgwrap{border-radius:18px;background:radial-gradient(circle at 20% 30%,#c79a62 0 1.5px,transparent 2px) 0 0/22px 22px,radial-gradient(circle at 70% 60%,#a97c46 0 1.5px,transparent 2px) 0 0/17px 17px,#b98a52;box-shadow:inset 0 0 40px #0006;padding:28px 0 16px}
#out,#gifout{max-height:calc(100dvh - 310px)}
.hung{position:relative;transform-origin:50% 0;animation:swing 5s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-1deg)}to{transform:rotate(1deg)}}
.hung.poke{animation:poke 1.8s ease-out}
@keyframes poke{0%{transform:rotate(7deg)}20%{transform:rotate(-5deg)}40%{transform:rotate(3.5deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(1deg)}100%{transform:rotate(0)}}
.tape{position:absolute;top:-11px;left:50%;width:58px;height:22px;transform:translateX(-50%) rotate(-2deg);background:#fff6b8cc;box-shadow:0 1px 3px #0005;z-index:2}
#board{justify-content:flex-start}
.cork{flex:1;width:100%;max-width:480px;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:26px 14px;align-content:start;padding:26px 14px 40px;overflow:auto;border-radius:18px;background:radial-gradient(circle at 20% 30%,#c79a62 0 1.5px,transparent 2px) 0 0/22px 22px,radial-gradient(circle at 70% 60%,#a97c46 0 1.5px,transparent 2px) 0 0/17px 17px,#b98a52;box-shadow:inset 0 0 40px #0006}
.cork .hint{grid-column:1/-1;color:#3b2a14}
.pin{position:relative;transform:rotate(var(--rot));background:#fffdf5;padding:5px 5px 4px;box-shadow:0 6px 12px #0006;transition:transform .2s}

            <button class="glass" id="flip" aria-label="Kamerayı çevir"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 0-14-5.3L4 9M4 4v5h5M4 12a8 8 0 0 0 14 5.3L20 15M20 20v-5h-5"/></svg></button></div><i class="rec"></i></div>

  <div class="seg" id="tabs"><button class="on" data-t="p-filter">Filtre</button><button data-t="p-frame">Çerçeve</button><button data-t="p-stk">Çıkartma</button><button data-t="p-skin">Görünüm</button></div>

  <header class="bar"><button class="ib" id="bback" aria-label="Geri"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Anı panosu</h1><span style="width:44px"></span></header>

<script>
const $=s=>document.querySelector(s);
const v=$('#v'),count=$('#count'),flash=$('#flash');
let dots=[];
let lastRaw=[],lastShots=[],photoBlob=null,gifBlob=null,tpl='strip',facing='user',filter='none',frame='#ffffff',busy=false,blob=null;
const sp=(r,g,b)=>[.393*r+.769*g+.189*b,.349*r+.686*g+.168*b,.272*r+.534*g+.131*b];
const F={
  none:{label:'Normal',css:'none'},
  bw:{label:'Siyah-Beyaz',css:'grayscale(1) contrast(1.15)',px:(r,g,b)=>{const y=.299*r+.587*g+.114*b,c=(y-128)*1.15+128;return[c,c,c]}},
  sepia:{label:'Sepya',css:'sepia(.85)',px:(r,g,b)=>sp(r,g,b).map(x=>x)},
  vintage:{label:'Vintage',css:'sepia(.35) saturate(1.3) contrast(.95) brightness(1.05)',px:(r,g,b)=>{const s=sp(r,g,b);return[r*.65+s[0]*.35+12,g*.65+s[1]*.35+8,b*.65+s[2]*.35+18]}}
};
const COLORS=['#ffffff','#111111','#ffc2d1','#bde0fe'];
const TPL={strip:{label:'Şerit',n:4,w:640,h:480,asp:'4/3'},polaroid:{label:'Polaroid',n:1,w:600,h:600,asp:'1/1'},grid:{label:'Kolaj 2x2',n:4,w:640,h:480,asp:'4/3'}};
function setDots(n){const d=$('#dots');d.innerHTML='<i></i>'.repeat(n);dots=[...d.children]}
function setTpl(k){tpl=k;$('.stage').style.aspectRatio=TPL[k].asp;setDots(TPL[k].n);placeStk();buildFilm()}
Object.entries(TPL).forEach(([k,t])=>{const b=document.createElement('button');b.className='chip'+(k===tpl?' sel':'');b.textContent=t.label;
  b.onclick=()=>{setTpl(k);document.querySelectorAll('#tpls .chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};$('#tpls').append(b)});
setDots(4);

function setFilter(k){filter=k;v.style.filter=F[k].css;
  document.querySelectorAll('#filters .chip,#rfilters .chip').forEach(b=>b.classList.toggle('sel',b.dataset.k===k));
  if(!$('#res').hidden&&lastRaw.length)renderResult()}
['#filters','#rfilters'].forEach(id=>Object.entries(F).forEach(([k,f])=>{const b=document.createElement('button');
  b.className='chip'+(k===filter?' sel':'');b.dataset.k=k;b.textContent=f.label;b.onclick=()=>setFilter(k);$(id).append(b)}));
COLORS.forEach(c=>{const b=document.createElement('button');b.className='sw'+(c===frame?' sel':'');b.style.background=c;
  b.onclick=()=>{frame=c;setTheme('none');document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};$('#colors').append(b)});

async function startCam(){
  try{
    if(v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop());
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:960}},audio:false});
    v.srcObject=s;v.style.transform=facing==='user'?'scaleX(-1)':'none';await v.play();$('#msg').textContent='';
  }catch(e){$('#msg').textContent='Kamera açılamadı. Kamera iznini ver ve sayfayı HTTPS üzerinden aç.'}
}
function beep(f=880,d=.08){try{const a=beep.a||(beep.a=new (window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function grab(){
  const {w,h}=TPL[tpl],c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const vw=v.videoWidth,vh=v.videoHeight,t=w/h;let sw=vw,sh=vw/t;if(sh>vh){sh=vh;sw=vh*t}
  if(facing==='user'){x.translate(w,0);x.scale(-1,1)}
  x.drawImage(v,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,w,h);
  return c;
}
function styled(raw){
  const w=raw.width,h=raw.height,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(raw,0,0);
  const p=F[filter].px;
  if(p){const d=x.getImageData(0,0,w,h),a=d.data;for(let i=0;i<a.length;i+=4){const o=p(a[i],a[i+1],a[i+2]);a[i]=o[0];a[i+1]=o[1];a[i+2]=o[2]}x.putImageData(d,0,0)}
  const st=STK[stk];
  if(st.e.length){x.font=Math.round(h*.22)+'px serif';x.textAlign='center';x.textBaseline='middle';
    POS.forEach((p,i)=>{x.save();x.translate(p.x*w,p.y*h);x.rotate(p.r);x.fillText(st.e[i%st.e.length],0,0);x.restore()})}
  if(stamp){const d=new Date(),t="'"+String(d.getFullYear()).slice(2)+' '+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getDate()).padStart(2,'0');
    x.save();x.textAlign='right';x.textBaseline='alphabetic';x.font='bold '+Math.round(h*.075)+'px "Courier New",monospace';x.shadowColor='#ff6a00';x.shadowBlur=h*.02;x.fillStyle='#ff9a2e';x.fillText(t,w-h*.04,h-h*.045);x.restore()}
  return c;
}
function layout(shots){
  const {w,h}=TPL[tpl],P=40,G=24,c=document.createElement('canvas'),ink=frame==='#111111'?'#fff':'#222';let FT=150;
  if(tpl==='strip'){c.width=w+2*P;c.height=P+4*h+3*G+FT}
  else if(tpl==='grid'){FT=130;c.width=2*w+G+2*P;c.height=P+2*h+G+FT}
  else{FT=170;c.width=w+2*P;c.height=P+h+FT}
  const x=c.getContext('2d');bg(x,c);
  shots.forEach((s,i)=>{const px=tpl==='grid'?P+(i%2)*(w+G):P,py=tpl==='strip'?P+i*(h+G):tpl==='grid'?P+Math.floor(i/2)*(h+G):P;x.drawImage(s,px,py)});
  x.fillStyle=inkc();x.textAlign='center';
  x.font='bold 44px Georgia,serif';x.fillText(capt(),c.width/2,c.height-FT/2+5);
  x.font='26px Georgia,serif';x.fillText(new Date().toLocaleDateString('tr-TR'),c.width/2,c.height-FT/2+45);
  return c;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function ctx(){return beep.a||(beep.a=new (window.AudioContext||window.webkitAudioContext)())}
function tick(vol){try{const a=ctx(),n=Math.floor(a.sampleRate*.05),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(n*.22));
  const s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
function clickSound(){tick(.7);setTimeout(()=>tick(1),70)}
function paperSound(sec,vol,motor){try{const a=ctx(),t=a.currentTime,n=Math.floor(a.sampleRate*sec),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.Q.value=.7;
  f.frequency.setValueAtTime(1000,t);f.frequency.linearRampToValueAtTime(2400,t+sec);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.25,sec/3));g.gain.setValueAtTime(vol,t+sec*.75);g.gain.linearRampToValueAtTime(0,t+sec);
  s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start();
  if(motor){const o=a.createOscillator(),og=a.createGain();o.type='triangle';o.frequency.setValueAtTime(55,t);o.frequency.linearRampToValueAtTime(72,t+sec*.3);o.frequency.linearRampToValueAtTime(60,t+sec);
    og.gain.setValueAtTime(.05,t);og.gain.linearRampToValueAtTime(0,t+sec);o.connect(og);og.connect(a.destination);o.start();o.stop(t+sec)}}catch(e){}}
function thump(){try{const a=ctx(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(45,t+.15);
  g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(a.destination);o.start();o.stop(t+.2)}catch(e){}}
function bulbs(on){document.querySelectorAll('.bulb').forEach(b=>b.classList.toggle('pop',on))}
let pending=false,rest=0;
function buildFilm(){
  const n=TPL[tpl].n,pw=$('#pw');
  pw.classList.remove('ready');pw.style.transition='none';pw.style.transform='translateY(-500px)';$('#pi').classList.remove('hang','land');
  $('#paper').style.overflow='';$('#pimg').removeAttribute('src');$('#leds').innerHTML='<i></i>'.repeat(n);pending=false;$('#tray span').textContent='';
}
async function dropShot(c,i){
  const M=$('#machine'),m=M.getBoundingClientRect(),s=$('.stage').getBoundingClientRect(),t=$('#slit').getBoundingClientRect();
  const d=document.createElement('canvas');d.width=c.width;d.height=c.height;d.getContext('2d').drawImage(c,0,0);
  d.className='drop';d.style.cssText='left:'+(s.left-m.left)+'px;top:'+(s.top-m.top)+'px;width:'+s.width+'px;height:'+s.height+'px';
  M.append(d);await wait(750);
  const dx=(t.left+t.width/2)-(s.left+s.width/2),dy=(t.top+t.height/2)-(s.top+s.height/2),sc=t.width/s.width;
  d.style.transform='translate('+dx+'px,'+dy+'px) scale('+sc+') rotate(-4deg)';d.style.opacity='0';paperSound(.3,.06,false);
  await wait(650);d.remove();const l=$('#leds').children[i];if(l)l.classList.add('on');
}
function renderResult(){
  const sh=lastRaw.map(styled);lastShots=sh;
  layout(sh).toBlob(b=>{photoBlob=b;gifBlob=null;$('#mkgif').hidden=sh.length<2;$('#viewrow').hidden=true;showView('photo');$('#out').src=URL.createObjectURL(b)},'image/jpeg',.92);
}
async function printStrip(b){
  const M=$('#machine'),pw=$('#pw'),pi=$('#pi'),im=$('#pimg');
  im.src=URL.createObjectURL(b);try{await im.decode()}catch(e){}
  pw.style.transition='none';pw.style.transform='none';
  const Sh=im.getBoundingClientRect().height;
  pw.style.transform='translateY('+(-Sh-6)+'px)';void pw.offsetWidth;
  const cr=$('#paper').getBoundingClientRect(),tr=$('#tray').getBoundingClientRect();rest=Math.max(0,tr.top+26-cr.top-Sh);
  pi.classList.add('hang');M.classList.add('motor');paperSound(3.4,.13,true);
  pw.style.transition='transform 3.4s cubic-bezier(.3,.1,.5,1)';pw.style.transform='translateY(0px)';
  await wait(3500);
  M.classList.remove('motor');pi.classList.remove('hang');
  if(rest>0){pw.style.transition='transform .55s cubic-bezier(.55,0,.9,.55)';pw.style.transform='translateY('+rest+'px)';await wait(560)}
  thump();pi.classList.add('land');await wait(600);
  pw.classList.add('ready');$('#tray span').textContent='Dokun 👆';
}
async function run(){
  if(busy)return;busy=true;$('#go').disabled=true;try{ctx().resume()}catch(e){}
  const M=$('#machine'),raw=[],N=TPL[tpl].n;setDots(N);buildFilm();
  try{
    M.classList.add('open','shooting');await wait(1500);
    for(let i=0;i<N;i++){
      dots.forEach((d,j)=>d.classList.toggle('on',j<i));
      for(let n=i?2:3;n>0;n--){count.textContent=n;pop();beep(660);setLamp(n);if(n===1)$('#af').classList.add('on');await wait(1000)}
      count.textContent='';setLamp(0);$('#af').classList.remove('on');clickSound();flash.classList.add('on');bulbs(true);v.classList.add('burn');$('.window').classList.add('glow');const c=grab();raw.push(c);await wait(110);flash.classList.remove('on');bulbs(false);v.classList.remove('burn');$('.window').classList.remove('glow');
      await dropShot(styled(c),i);
    }
    dots.forEach(d=>d.classList.add('on'));M.classList.remove('open','shooting');
    if(tpl==='duo'){finishDuo(raw.map(styled));return}
    lastRaw=raw;await wait(1000);
    const sh=raw.map(styled);lastShots=sh;
    const b=await new Promise(r=>layout(sh).toBlob(r,'image/jpeg',.92));
    blob=photoBlob=b;gifBlob=null;pending=true;
    await printStrip(b);
  }finally{busy=false;$('#go').disabled=false;M.classList.remove('open','shooting','motor');dots.forEach(d=>d.classList.remove('on'))}
}
function takeStrip(){
  const pw=$('#pw');if(!pending||!pw.classList.contains('ready'))return;
  saveCurrent();pw.classList.remove('ready');$('#paper').style.overflow='visible';
  pw.style.transition='transform .5s cubic-bezier(.3,1.2,.5,1)';pw.style.transform='translateY('+(rest-70)+'px) scale(1.25)';
  setTimeout(()=>{$('#mkgif').hidden=lastShots.length<2;$('#viewrow').hidden=true;$('#rfilters').hidden=false;showView('photo');
    $('#out').src=URL.createObjectURL(photoBlob);$('#cam').hidden=true;$('#res').hidden=false;buildFilm()},480);
}
$('#pw').onclick=$('#tray').onclick=takeStrip;

/* ---- GIF ---- */
function palette(imgs){
  const px=[];for(const f of imgs){const a=f.data;for(let i=0;i<a.length;i+=28)px.push([a[i],a[i+1],a[i+2]])}
  const boxes=[px];
  while(boxes.length<256){
    let bi=0,bs=0;boxes.forEach((b,i)=>{if(b.length>bs){bs=b.length;bi=i}});
    if(bs<2)break;const b=boxes[bi];
    const mn=[255,255,255],mx=[0,0,0];
    for(const p of b)for(let c=0;c<3;c++){if(p[c]<mn[c])mn[c]=p[c];if(p[c]>mx[c])mx[c]=p[c]}
    const ch=[0,1,2].sort((i,j)=>(mx[j]-mn[j])-(mx[i]-mn[i]))[0];
    b.sort((p,q)=>p[ch]-q[ch]);const m=b.length>>1;boxes.splice(bi,1,b.slice(0,m),b.slice(m));
  }
  return boxes.map(b=>{const t=[0,0,0];for(const p of b)for(let c=0;c<3;c++)t[c]+=p[c];return t.map(x=>Math.round(x/b.length))});
}
function makeGif(canvases,order,delay){
  const w=canvases[0].width,h=canvases[0].height;
  const imgs=canvases.map(c=>c.getContext('2d').getImageData(0,0,w,h));
  const pal=palette(imgs),cache=new Int16Array(32768).fill(-1);
  const near=(r,g,b)=>{const k=(r>>3)<<10|(g>>3)<<5|(b>>3);let v=cache[k];
    if(v<0){let best=1e9;for(let i=0;i<pal.length;i++){const d=(pal[i][0]-r)**2+(pal[i][1]-g)**2+(pal[i][2]-b)**2;if(d<best){best=d;v=i}}cache[k]=v}return v};
  const idxs=imgs.map(im=>{const d=im.data,a=new Uint8Array(w*h);for(let i=0,j=0;i<d.length;i+=4,j++)a[j]=near(d[i],d[i+1],d[i+2]);return a});
  const o=[],u16=n=>o.push(n&255,(n>>8)&255);
  o.push(71,73,70,56,57,97);u16(w);u16(h);o.push(0xF7,0,0);
  for(let i=0;i<256;i++)o.push(...(pal[i]||[0,0,0]));
  o.push(0x21,0xFF,11,...[...'NETSCAPE2.0'].map(c=>c.charCodeAt(0)),3,1,0,0,0);
  for(const k of order){
    o.push(0x21,0xF9,4,0x04);u16(delay);o.push(0,0);
    o.push(0x2C);u16(0);u16(0);u16(w);u16(h);o.push(0,8);
    const a=idxs[k],bytes=[];let cur=0,nb=0,n=0;
    const put=c=>{cur|=c<<nb;nb+=9;while(nb>=8){bytes.push(cur&255);cur>>=8;nb-=8}};
    for(let i=0;i<a.length;i++){if(n===0)put(256);put(a[i]);if(++n===250)n=0}
    put(257);if(nb>0)bytes.push(cur&255);
    for(let i=0;i<bytes.length;i+=255){const ch=bytes.slice(i,i+255);o.push(ch.length,...ch)}
    o.push(0);
  }
  o.push(0x3B);return new Blob([new Uint8Array(o)],{type:'image/gif'});
}

/* ---- Uzaktan photobooth (PeerJS) ---- */
let peer=null,conn=null,role=null,prevTpl='strip',myShots=null,theirShots=null;
TPL.duo={label:'Uzaktan',n:4,w:480,h:360,asp:'4/3'};
const CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',rm=t=>$('#rmsg').textContent=t;
$('#remote').onclick=()=>{$('#cam').hidden=true;$('#rem').hidden=false};
$('#rback').onclick=()=>{$('#rem').hidden=true;$('#cam').hidden=false;placeStk()};
function connected(){
  if(tpl==='duo')return;
  prevTpl=tpl;tpl='duo';$('.stage').style.aspectRatio='8/3';setDots(4);buildFilm();
  $('#rem').hidden=true;$('#cam').hidden=false;$('#tpls').hidden=true;$('#flip').hidden=true;$('#go').hidden=role==='guest';
  $('#msg').style.color='#9fe3a8';$('#msg').textContent=role==='host'?'Bağlandı! Çekimi sen başlat.':'Bağlandı! Çekimi oda sahibi başlatır.';joinFx();
}
function leave(){
  if(tpl==='duo')setTpl(prevTpl);
  $('#rv').hidden=true;$('#tpls').hidden=false;$('#flip').hidden=false;$('#go').hidden=false;
  myShots=theirShots=null;conn=null;role=null;if(peer){peer.destroy();peer=null}
  $('#msg').textContent='';
}
function wire(c){
  conn=c;
  c.on('data',d=>{if(d.t==='go')run();else if(d.t==='shots'){theirShots=d.imgs;tryCompose()}});
  c.on('close',()=>{leave();$('#msg').style.color='#ffb4b4';$('#msg').textContent='Bağlantı koptu.'});
}
function showRemote(s,first){const r=$('#rv');r.srcObject=s;r.hidden=false;if(first)r.style.order=-1;r.play().catch(()=>{});connected()}
$('#mkroom').onclick=()=>{
  if(!window.Peer)return rm('Bağlantı kütüphanesi yüklenemedi, internet gerekli.');
  const code=[...Array(4)].map(()=>CH[Math.random()*CH.length|0]).join('');
  role='host';peer=new Peer('pbooth-'+code);
  peer.on('open',()=>rm('Oda kodu: '+code+'. Arkadaşın Katıl diyip bu kodu girsin.'));
  peer.on('error',e=>rm('Hata: '+e.type+(e.type==='unavailable-id'?' (tekrar dene)':'')));
  peer.on('connection',c=>wire(c));
  peer.on('call',call=>{call.answer(v.srcObject);call.on('stream',s=>showRemote(s,false))});
};
$('#join').onclick=()=>{
  if(!window.Peer)return rm('Bağlantı kütüphanesi yüklenemedi, internet gerekli.');
  const code=$('#code').value.trim().toUpperCase();if(code.length!==4)return rm('4 haneli kodu gir.');
  role='guest';peer=new Peer();
  peer.on('error',e=>rm('Hata: '+e.type));
  peer.on('open',()=>{rm('Bağlanıyor…');const c=peer.connect('pbooth-'+code,{reliable:true});wire(c);
    c.on('open',()=>{const call=peer.call('pbooth-'+code,v.srcObject);call.on('stream',s=>showRemote(s,true))})});
};
function finishDuo(shots){
  myShots=shots.map(c=>c.toDataURL('image/jpeg',.8));
  if(conn)conn.send({t:'shots',imgs:myShots});
  tryCompose();
}
function tryCompose(){
  if(!myShots||!theirShots)return;
  const mine=myShots,theirs=theirShots;myShots=theirShots=null;
  const left=role==='host'?mine:theirs,right=role==='host'?theirs:mine;
  Promise.all([...left,...right].map(u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u}))).then(im=>{
    const w=480,h=360,P=40,G=24,FT=150,c=document.createElement('canvas');c.width=2*w+G+2*P;c.height=P+4*h+3*G+FT;
    const x=c.getContext('2d');bg(x,c);
    for(let i=0;i<4;i++){x.drawImage(im[i],P,P+i*(h+G));x.drawImage(im[4+i],P+w+G,P+i*(h+G))}
    x.fillStyle=inkc();x.textAlign='center';
    x.font='bold 44px Georgia,serif';x.fillText(capt(),c.width/2,c.height-FT/2+5);
    x.font='26px Georgia,serif';x.fillText(new Date().toLocaleDateString('tr-TR'),c.width/2,c.height-FT/2+45);
    c.toBlob(b=>{lastShots=[];lastRaw=[];$('#rfilters').hidden=true;blob=photoBlob=b;saveCurrent();gifBlob=null;$('#mkgif').hidden=true;$('#viewrow').hidden=true;showView('photo');
      $('#out').src=URL.createObjectURL(b);$('#cam').hidden=true;$('#res').hidden=false},'image/jpeg',.92);
  });
}

function DB(){return new Promise((res,rej)=>{const r=indexedDB.open('photobooth',1);r.onupgradeneeded=()=>r.result.createObjectStore('s',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbPut(o){const d=await DB();return new Promise((res,rej)=>{const t=d.transaction('s','readwrite');t.objectStore('s').put(o);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function dbAll(){const d=await DB();return new Promise((res,rej)=>{const q=d.transaction('s').objectStore('s').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function dbDel(id){const d=await DB();return new Promise((res,rej)=>{const t=d.transaction('s','readwrite');t.objectStore('s').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}

const CP='M0 0H100C100 60 97 120 76 190C62 235 92 275 99 300H0Z',EDGE='M100 0C100 60 97 120 76 190C62 235 92 275 99 300';
const FO=[['M13 0C16 90 8 200 6 300',.3],['M31 0C28 100 36 200 32 300',.22],['M50 0C53 90 46 210 49 300',.3],['M67 0C64 95 70 190 66 300',.2],['M84 0C86 80 80 170 78 215',.28]];
function curtainSVG(i){
  const st=[[0,2],[.1,1],[.19,2],[.31,1],[.41,2],[.55,1],[.64,2],[.78,1],[.88,2],[1,1]].map(a=>'<stop offset="'+a[0]+'" style="stop-color:var(--mc'+a[1]+')"/>').join('');
  const body='<path d="'+CP+'" fill="url(#cx'+i+')"/><path d="'+CP+'" fill="url(#cy'+i+')"/>'
   +FO.map(f=>'<path d="'+f[0]+'" fill="none" stroke="#000" stroke-opacity="'+f[1]+'" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+f[0]+'" transform="translate(5 0)" fill="none" stroke="#fff" stroke-opacity=".11" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>').join('')
   +'<path d="'+EDGE+'" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2" vector-effect="non-scaling-stroke"/>'
   +'<path d="M0 183C38 194 62 192 78 187" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="8" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
   +'<path d="M0 181C38 192 62 190 78 185" fill="none" style="stroke:var(--mt)" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
   +'<path d="M0 298.5H99" fill="none" style="stroke:var(--mt)" stroke-width="3" vector-effect="non-scaling-stroke"/>';
  return '<svg viewBox="0 0 100 300" preserveAspectRatio="none"><defs><linearGradient id="cx'+i+'">'+st+'</linearGradient><linearGradient id="cy'+i+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-opacity=".5"/><stop offset=".2" stop-opacity="0"/><stop offset=".72" stop-opacity=".05"/><stop offset="1" stop-opacity=".45"/></linearGradient></defs>'
   +(i?'<g transform="translate(100 0) scale(-1 1)">'+body+'</g>':body)+'</svg>';
}
