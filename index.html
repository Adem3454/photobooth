<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photobooth</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photobooth">
<meta name="theme-color" content="#111111">
<script async src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:-apple-system,system-ui,sans-serif}
main{height:100dvh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);overflow:auto}
main[hidden]{display:none}
.stage{position:relative;width:100%;max-width:480px;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#count{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;font-weight:700;text-shadow:0 2px 12px #0008}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#flash.on{opacity:1;transition:none}
#dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:8px}
#dots i{width:10px;height:10px;border-radius:50%;background:#fff5}
#dots i.on{background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:8px 14px;border-radius:99px;border:1px solid #fff4;background:transparent;color:#fff;font-size:15px}
.chip.sel{background:#fff;color:#111}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff4}
.sw.sel{border-color:#fff;box-shadow:0 0 0 2px #111,0 0 0 4px #fff}
button.main{padding:16px 40px;border:0;border-radius:99px;background:#ff4d6d;color:#fff;font-size:18px;font-weight:600}
button.ghost{background:#333}
#out,#gifout{max-height:calc(100dvh - 140px);max-width:100%;border-radius:6px;box-shadow:0 6px 30px #0008}
#msg{color:#ffb4b4;margin:0;text-align:center}
.flip{position:absolute;top:10px;right:10px;z-index:2;background:#0006;border-color:#fff6;padding:6px 10px}
[hidden]{display:none!important}
.stage{display:flex}video{min-width:0}
input{padding:14px;border-radius:12px;border:1px solid #fff4;background:#222;color:#fff;font-size:20px;text-align:center;width:130px;text-transform:uppercase}
#rem{justify-content:center}#rmsg{text-align:center;color:#9fe3a8;margin:0}
#stk{position:absolute;inset:0;pointer-events:none;overflow:hidden}#stk span{position:absolute;line-height:1}
</style>
</head>
<body>
<main id="cam">
  <div class="stage"><video id="v" playsinline muted autoplay></video><video id="rv" playsinline muted autoplay hidden></video><div id="count"></div><div id="flash"></div><div id="stk"></div><div id="dots"></div><button class="chip flip" id="flip">🔄</button></div>
  <div class="row" id="tpls"></div>
  <div class="row"><button class="chip" id="remote">👥 Uzaktan çekim</button></div>
  <div class="row" id="filters"></div>
  <div class="row" id="colors"></div>
  <div class="row" id="themes"></div>
  <div class="row" id="stks"></div>
  <input id="cap" maxlength="22" placeholder="Alt yazı (isteğe bağlı)" style="width:240px;text-transform:none">
  <button class="main" id="go">Çekime başla</button>
  <p id="msg"></p>
</main>
<main id="rem" hidden>
  <h2>Uzaktan photobooth</h2>
  <button class="main" id="mkroom">Oda kur</button>
  <div class="row"><input id="code" maxlength="4" placeholder="KOD" autocapitalize="characters"><button class="main ghost" id="join">Katıl</button></div>
  <p id="rmsg"></p>
  <button class="chip" id="rback">Geri</button>
</main>
<main id="res" hidden>
  <img id="out" alt="Photobooth şeridi"><img id="gifout" alt="GIF" hidden>
  <div class="row" id="viewrow" hidden><button class="chip sel" id="vPhoto">Fotoğraf</button><button class="chip" id="vGif">GIF</button></div>
  <div class="row"><button class="main" id="share">Paylaş / Kaydet</button><button class="main ghost" id="mkgif" hidden>GIF yap</button><button class="main ghost" id="again">Yeniden çek</button></div>
</main>
<script>
const $=s=>document.querySelector(s);
const v=$('#v'),count=$('#count'),flash=$('#flash');
let dots=[];
let lastShots=[],photoBlob=null,gifBlob=null,tpl='strip',facing='user',filter='none',frame='#ffffff',busy=false,blob=null;
const sp=(r,g,b)=>[.393*r+.769*g+.189*b,.349*r+.686*g+.168*b,.272*r+.534*g+.131*b];
const F={
  none:{label:'Normal',css:'none'},
  bw:{label:'Siyah-Beyaz',css:'grayscale(1) contrast(1.15)',px:(r,g,b)=>{const y=.299*r+.587*g+.114*b,c=(y-128)*1.15+128;return[c,c,c]}},
  sepia:{label:'Sepya',css:'sepia(.85)',px:(r,g,b)=>sp(r,g,b).map(x=>x)},
  vintage:{label:'Vintage',css:'sepia(.35) saturate(1.3) contrast(.95) brightness(1.05)',px:(r,g,b)=>{const s=sp(r,g,b);return[r*.65+s[0]*.35+12,g*.65+s[1]*.35+8,b*.65+s[2]*.35+18]}}
};
const COLORS=['#ffffff','#111111','#ffc2d1','#bde0fe'];
const TPL={strip:{label:'Şerit',n:4,w:640,h:480,asp:'4/3'},polaroid:{label:'Polaroid',n:1,w:600,h:600,asp:'1/1'},grid:{label:'Kolaj 2x2',n:4,w:640,h:480,asp:'4/3'}};
function setDots(n){const d=$('#dots');d.innerHTML='<i></i>'.repeat(n);dots=[...d.children]}
function setTpl(k){tpl=k;$('.stage').style.aspectRatio=TPL[k].asp;setDots(TPL[k].n);placeStk()}
Object.entries(TPL).forEach(([k,t])=>{const b=document.createElement('button');b.className='chip'+(k===tpl?' sel':'');b.textContent=t.label;
  b.onclick=()=>{setTpl(k);document.querySelectorAll('#tpls .chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};$('#tpls').append(b)});
setDots(4);

Object.entries(F).forEach(([k,f])=>{const b=document.createElement('button');b.className='chip'+(k===filter?' sel':'');b.textContent=f.label;
  b.onclick=()=>{filter=k;v.style.filter=f.css;document.querySelectorAll('#filters .chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};$('#filters').append(b)});
COLORS.forEach(c=>{const b=document.createElement('button');b.className='sw'+(c===frame?' sel':'');b.style.background=c;
  b.onclick=()=>{frame=c;setTheme('none');document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};$('#colors').append(b)});

async function startCam(){
  try{
    if(v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop());
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:960}},audio:false});
    v.srcObject=s;v.style.transform=facing==='user'?'scaleX(-1)':'none';await v.play();$('#msg').textContent='';
  }catch(e){$('#msg').textContent='Kamera açılamadı. Kamera iznini ver ve sayfayı HTTPS üzerinden aç.'}
}
function beep(f=880,d=.08){try{const a=beep.a||(beep.a=new (window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function grab(){
  const {w,h}=TPL[tpl],c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const vw=v.videoWidth,vh=v.videoHeight,t=w/h;let sw=vw,sh=vw/t;if(sh>vh){sh=vh;sw=vh*t}
  if(facing==='user'){x.translate(w,0);x.scale(-1,1)}
  x.drawImage(v,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,w,h);
  const p=F[filter].px;
  if(p){const d=x.getImageData(0,0,w,h),a=d.data;for(let i=0;i<a.length;i+=4){const o=p(a[i],a[i+1],a[i+2]);a[i]=o[0];a[i+1]=o[1];a[i+2]=o[2]}x.putImageData(d,0,0)}
  const st=STK[stk];
  if(st.e.length){x.setTransform(1,0,0,1,0,0);x.font=Math.round(h*.22)+'px serif';x.textAlign='center';x.textBaseline='middle';
    POS.forEach((p,i)=>{x.save();x.translate(p.x*w,p.y*h);x.rotate(p.r);x.fillText(st.e[i%st.e.length],0,0);x.restore()})}
  return c;
}
function layout(shots){
  const {w,h}=TPL[tpl],P=40,G=24,c=document.createElement('canvas'),ink=frame==='#111111'?'#fff':'#222';let FT=150;
  if(tpl==='strip'){c.width=w+2*P;c.height=P+4*h+3*G+FT}
  else if(tpl==='grid'){FT=130;c.width=2*w+G+2*P;c.height=P+2*h+G+FT}
  else{FT=170;c.width=w+2*P;c.height=P+h+FT}
  const x=c.getContext('2d');bg(x,c);
  shots.forEach((s,i)=>{const px=tpl==='grid'?P+(i%2)*(w+G):P,py=tpl==='strip'?P+i*(h+G):tpl==='grid'?P+Math.floor(i/2)*(h+G):P;x.drawImage(s,px,py)});
  x.fillStyle=inkc();x.textAlign='center';
  x.font='bold 44px Georgia,serif';x.fillText(capt(),c.width/2,c.height-FT/2+5);
  x.font='26px Georgia,serif';x.fillText(new Date().toLocaleDateString('tr-TR'),c.width/2,c.height-FT/2+45);
  return c;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function run(){
  if(busy)return;busy=true;$('#go').disabled=true;const shots=[];
  const N=TPL[tpl].n;setDots(N);for(let i=0;i<N;i++){
    dots.forEach((d,j)=>d.classList.toggle('on',j<i));
    for(let n=3;n>0;n--){count.textContent=n;beep(660);await wait(1000)}
    count.textContent='';beep(1200,.15);flash.classList.add('on');shots.push(grab());await wait(120);flash.classList.remove('on');await wait(900);
  }
  dots.forEach(d=>d.classList.add('on'));
  if(tpl==='duo'){busy=false;$('#go').disabled=false;dots.forEach(d=>d.classList.remove('on'));finishDuo(shots);return}
  lastShots=shots;layout(shots).toBlob(b=>{blob=photoBlob=b;gifBlob=null;$('#mkgif').hidden=shots.length<2;$('#viewrow').hidden=true;showView('photo');$('#out').src=URL.createObjectURL(b);$('#cam').hidden=true;$('#res').hidden=false;busy=false;$('#go').disabled=false;dots.forEach(d=>d.classList.remove('on'))},'image/jpeg',.92);
}

/* ---- GIF ---- */
function palette(imgs){
  const px=[];for(const f of imgs){const a=f.data;for(let i=0;i<a.length;i+=28)px.push([a[i],a[i+1],a[i+2]])}
  const boxes=[px];
  while(boxes.length<256){
    let bi=0,bs=0;boxes.forEach((b,i)=>{if(b.length>bs){bs=b.length;bi=i}});
    if(bs<2)break;const b=boxes[bi];
    const mn=[255,255,255],mx=[0,0,0];
    for(const p of b)for(let c=0;c<3;c++){if(p[c]<mn[c])mn[c]=p[c];if(p[c]>mx[c])mx[c]=p[c]}
    const ch=[0,1,2].sort((i,j)=>(mx[j]-mn[j])-(mx[i]-mn[i]))[0];
    b.sort((p,q)=>p[ch]-q[ch]);const m=b.length>>1;boxes.splice(bi,1,b.slice(0,m),b.slice(m));
  }
  return boxes.map(b=>{const t=[0,0,0];for(const p of b)for(let c=0;c<3;c++)t[c]+=p[c];return t.map(x=>Math.round(x/b.length))});
}
function makeGif(canvases,order,delay){
  const w=canvases[0].width,h=canvases[0].height;
  const imgs=canvases.map(c=>c.getContext('2d').getImageData(0,0,w,h));
  const pal=palette(imgs),cache=new Int16Array(32768).fill(-1);
  const near=(r,g,b)=>{const k=(r>>3)<<10|(g>>3)<<5|(b>>3);let v=cache[k];
    if(v<0){let best=1e9;for(let i=0;i<pal.length;i++){const d=(pal[i][0]-r)**2+(pal[i][1]-g)**2+(pal[i][2]-b)**2;if(d<best){best=d;v=i}}cache[k]=v}return v};
  const idxs=imgs.map(im=>{const d=im.data,a=new Uint8Array(w*h);for(let i=0,j=0;i<d.length;i+=4,j++)a[j]=near(d[i],d[i+1],d[i+2]);return a});
  const o=[],u16=n=>o.push(n&255,(n>>8)&255);
  o.push(71,73,70,56,57,97);u16(w);u16(h);o.push(0xF7,0,0);
  for(let i=0;i<256;i++)o.push(...(pal[i]||[0,0,0]));
  o.push(0x21,0xFF,11,...[...'NETSCAPE2.0'].map(c=>c.charCodeAt(0)),3,1,0,0,0);
  for(const k of order){
    o.push(0x21,0xF9,4,0x04);u16(delay);o.push(0,0);
    o.push(0x2C);u16(0);u16(0);u16(w);u16(h);o.push(0,8);
    const a=idxs[k],bytes=[];let cur=0,nb=0,n=0;
    const put=c=>{cur|=c<<nb;nb+=9;while(nb>=8){bytes.push(cur&255);cur>>=8;nb-=8}};
    for(let i=0;i<a.length;i++){if(n===0)put(256);put(a[i]);if(++n===250)n=0}
    put(257);if(nb>0)bytes.push(cur&255);
    for(let i=0;i<bytes.length;i+=255){const ch=bytes.slice(i,i+255);o.push(ch.length,...ch)}
    o.push(0);
  }
  o.push(0x3B);return new Blob([new Uint8Array(o)],{type:'image/gif'});
}
const nm=()=>blob.type==='image/gif'?'photobooth.gif':'photobooth.jpg';
function showView(k){const g=k==='gif';$('#out').hidden=g;$('#gifout').hidden=!g;blob=g?gifBlob:photoBlob;$('#vPhoto').classList.toggle('sel',!g);$('#vGif').classList.toggle('sel',g)}
$('#vPhoto').onclick=()=>showView('photo');$('#vGif').onclick=()=>showView('gif');
$('#mkgif').onclick=async()=>{
  const b=$('#mkgif');b.disabled=true;b.textContent='Hazırlanıyor…';await wait(60);
  try{
    const GW=360,GH=270,fs=lastShots.map(s=>{const c=document.createElement('canvas');c.width=GW;c.height=GH;const x=c.getContext('2d');bg(x,c);x.drawImage(s,10,10,GW-20,GH-20);return c});
    const n=fs.length,order=[...fs.keys(),...[...fs.keys()].slice(1,n-1).reverse()];
    gifBlob=makeGif(fs,order,60);
    $('#gifout').src=URL.createObjectURL(gifBlob);$('#viewrow').hidden=false;showView('gif');
  }catch(e){alert('GIF oluşturulamadı')}
  b.disabled=false;b.textContent='GIF yap';
};

/* ---- Temalar, çıkartmalar, alt yazı ---- */
const THEMES={
  none:{label:'Klasik',title:'photobooth'},
  sunset:{label:'Gün batımı',g:['#ff9a9e','#fecfef'],ink:'#5a2a3a',title:'photobooth'},
  ocean:{label:'Okyanus',g:['#a1c4fd','#c2e9fb'],ink:'#12355b',title:'photobooth'},
  grad:{label:'Mezuniyet',bg:'#1b2a4a',ink:'#ffd166',title:'Mezuniyet '+new Date().getFullYear()+' 🎓'},
  bday:{label:'Doğum günü',bg:'#ffe5ec',ink:'#c9184a',title:'Doğum günü 🎂'},
  retro:{label:'Retro',bg:'#f4e4c1',ink:'#6b4423',title:'retro booth'}
};
let THEME=THEMES.none;
function setTheme(k){THEME=THEMES[k];document.querySelectorAll('#themes .chip').forEach(b=>b.classList.toggle('sel',b.dataset.k===k))}
function bg(x,c){if(THEME.g){const g=x.createLinearGradient(0,0,0,c.height);g.addColorStop(0,THEME.g[0]);g.addColorStop(1,THEME.g[1]);x.fillStyle=g}else x.fillStyle=THEME.bg||frame;x.fillRect(0,0,c.width,c.height)}
function inkc(){return THEME.ink||(frame==='#111111'?'#fff':'#222')}
function capt(){return $('#cap').value.trim()||THEME.title}
Object.entries(THEMES).forEach(([k,t])=>{const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=t.label;
  b.onclick=()=>{setTheme(k);if(k!=='none')document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'))};$('#themes').append(b)});
setTheme('none');
const STK={none:{label:'Çıkartma yok',e:[]},love:{label:'💖 Aşk',e:['💖','✨','🎀']},party:{label:'🎉 Parti',e:['🎉','🎈','🥳']},cool:{label:'😎 Havalı',e:['😎','🔥','⚡']},star:{label:'⭐ Yıldız',e:['⭐','✨','🌟']}};
const POS=[{x:.1,y:.16,r:-.25},{x:.9,y:.84,r:.25},{x:.88,y:.16,r:.2}];
let stk='none';
function placeStk(){
  const d=$('#stk');d.innerHTML='';const e=STK[stk].e;if(!e.length||tpl==='duo')return;const sz=$('.stage').clientHeight*.22;
  POS.forEach((p,i)=>{const sp=document.createElement('span');sp.textContent=e[i%e.length];
    sp.style.cssText='left:'+p.x*100+'%;top:'+p.y*100+'%;font-size:'+sz+'px;transform:translate(-50%,-50%) rotate('+p.r+'rad)';d.append(sp)});
}
Object.entries(STK).forEach(([k,t])=>{const b=document.createElement('button');b.className='chip'+(k===stk?' sel':'');b.textContent=t.label;
  b.onclick=()=>{stk=k;document.querySelectorAll('#stks .chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');placeStk()};$('#stks').append(b)});
addEventListener('resize',placeStk);placeStk();

/* ---- Uzaktan photobooth (PeerJS) ---- */
let peer=null,conn=null,role=null,prevTpl='strip',myShots=null,theirShots=null;
TPL.duo={label:'Uzaktan',n:4,w:480,h:360,asp:'4/3'};
const CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',rm=t=>$('#rmsg').textContent=t;
$('#remote').onclick=()=>{$('#cam').hidden=true;$('#rem').hidden=false};
$('#rback').onclick=()=>{$('#rem').hidden=true;$('#cam').hidden=false;placeStk()};
function connected(){
  if(tpl==='duo')return;
  prevTpl=tpl;tpl='duo';$('.stage').style.aspectRatio='8/3';setDots(4);
  $('#rem').hidden=true;$('#cam').hidden=false;$('#tpls').hidden=true;$('#flip').hidden=true;$('#go').hidden=role==='guest';
  $('#msg').style.color='#9fe3a8';$('#msg').textContent=role==='host'?'Bağlandı! Çekimi sen başlat.':'Bağlandı! Çekimi oda sahibi başlatır.';
}
function leave(){
  if(tpl==='duo')setTpl(prevTpl);
  $('#rv').hidden=true;$('#tpls').hidden=false;$('#flip').hidden=false;$('#go').hidden=false;
  myShots=theirShots=null;conn=null;role=null;if(peer){peer.destroy();peer=null}
  $('#msg').textContent='';
}
function wire(c){
  conn=c;
  c.on('data',d=>{if(d.t==='go')run();else if(d.t==='shots'){theirShots=d.imgs;tryCompose()}});
  c.on('close',()=>{leave();$('#msg').style.color='#ffb4b4';$('#msg').textContent='Bağlantı koptu.'});
}
function showRemote(s,first){const r=$('#rv');r.srcObject=s;r.hidden=false;if(first)r.style.order=-1;r.play().catch(()=>{});connected()}
$('#mkroom').onclick=()=>{
  if(!window.Peer)return rm('Bağlantı kütüphanesi yüklenemedi, internet gerekli.');
  const code=[...Array(4)].map(()=>CH[Math.random()*CH.length|0]).join('');
  role='host';peer=new Peer('pbooth-'+code);
  peer.on('open',()=>rm('Oda kodu: '+code+'. Arkadaşın Katıl diyip bu kodu girsin.'));
  peer.on('error',e=>rm('Hata: '+e.type+(e.type==='unavailable-id'?' (tekrar dene)':'')));
  peer.on('connection',c=>wire(c));
  peer.on('call',call=>{call.answer(v.srcObject);call.on('stream',s=>showRemote(s,false))});
};
$('#join').onclick=()=>{
  if(!window.Peer)return rm('Bağlantı kütüphanesi yüklenemedi, internet gerekli.');
  const code=$('#code').value.trim().toUpperCase();if(code.length!==4)return rm('4 haneli kodu gir.');
  role='guest';peer=new Peer();
  peer.on('error',e=>rm('Hata: '+e.type));
  peer.on('open',()=>{rm('Bağlanıyor…');const c=peer.connect('pbooth-'+code,{reliable:true});wire(c);
    c.on('open',()=>{const call=peer.call('pbooth-'+code,v.srcObject);call.on('stream',s=>showRemote(s,true))})});
};
function finishDuo(shots){
  myShots=shots.map(c=>c.toDataURL('image/jpeg',.8));
  if(conn)conn.send({t:'shots',imgs:myShots});
  tryCompose();
}
function tryCompose(){
  if(!myShots||!theirShots)return;
  const mine=myShots,theirs=theirShots;myShots=theirShots=null;
  const left=role==='host'?mine:theirs,right=role==='host'?theirs:mine;
  Promise.all([...left,...right].map(u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u}))).then(im=>{
    const w=480,h=360,P=40,G=24,FT=150,c=document.createElement('canvas');c.width=2*w+G+2*P;c.height=P+4*h+3*G+FT;
    const x=c.getContext('2d');bg(x,c);
    for(let i=0;i<4;i++){x.drawImage(im[i],P,P+i*(h+G));x.drawImage(im[4+i],P+w+G,P+i*(h+G))}
    x.fillStyle=inkc();x.textAlign='center';
    x.font='bold 44px Georgia,serif';x.fillText(capt(),c.width/2,c.height-FT/2+5);
    x.font='26px Georgia,serif';x.fillText(new Date().toLocaleDateString('tr-TR'),c.width/2,c.height-FT/2+45);
    c.toBlob(b=>{lastShots=[];blob=photoBlob=b;gifBlob=null;$('#mkgif').hidden=true;$('#viewrow').hidden=true;showView('photo');
      $('#out').src=URL.createObjectURL(b);$('#cam').hidden=true;$('#res').hidden=false},'image/jpeg',.92);
  });
}
$('#go').onclick=()=>{if(conn&&role==='host')conn.send({t:'go'});run()};

$('#again').onclick=()=>{$('#res').hidden=true;$('#cam').hidden=false;placeStk()};
$('#share').onclick=async()=>{
  const f=new File([blob],nm(),{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nm();a.click()}
};
$('#flip').onclick=()=>{facing=facing==='user'?'environment':'user';startCam()};
startCam();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
